name: Deploy Portfolio to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ===========================================
  # 1. DEPLOY TO GITHUB PAGES
  # ===========================================
  deploy-github-pages:
    name: Portfolio Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # ===========================================
      # 1.1 Checkout repository
      # ===========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===========================================
      # 1.2 Setup pages
      # ===========================================
      - name: Setup pages
        uses: actions/configure-pages@v4

      # ===========================================
      # 1.3 Upload artifact
      # ===========================================
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      # ===========================================
      # 1.4 Deploy to GitHub Pages
      # ===========================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: always()
        run: |
          echo "## 🌍 DarthFabax Portfolio Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** \`${{ steps.deployment.outputs.page_url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  # ===========================================
  # 2. SLACK NOTIFICATION
  # ===========================================
  notify-slack:
    name: Notify GitHub Pages Deploy Status
    needs: deploy-github-pages
    if: always()
    uses: darthfabax-org/actions/.github/workflows/slack-notify.yml@main
    secrets: inherit
    with:
      job_status: ${{ needs.deploy-github-pages.result }}
      message: |
        GitHub Pages Deploy completed to ${{ needs.deploy-github-pages.outputs.page_url }}
      workflow_name: "GitHub Pages Deploy"
      mention_on_failure: "@channel"
